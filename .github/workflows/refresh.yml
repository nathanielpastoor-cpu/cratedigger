name: Refresh CrateDigger

# Re-pulls fresh music and redeploys the site on a schedule.
# Runs the discovery pipeline from the committed taste_profile.json (your profile
# + label list). profile_library.py is NOT run here (it needs your local music
# library) — re-run that locally and commit taste_profile.json when your library changes.

on:
  schedule:
    - cron: "0 8 * * *"      # daily at 08:00 UTC (~3am US Eastern); change to taste
  workflow_dispatch: {}        # adds a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each fetcher is allowed to fail without killing the run (a flaky source
      # just leaves its section at the committed data); the build must succeed.
      - run: python bandcamp_fresh.py
        continue-on-error: true
      - run: python recommend.py
        continue-on-error: true
      - run: python genres.py
        continue-on-error: true
      - run: python soundcloud.py
        continue-on-error: true
      - run: python build_swipe.py
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
